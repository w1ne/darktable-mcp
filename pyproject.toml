[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darktable-mcp"
dynamic = ["version"]
description = "MCP server for darktable photo management with headless library operations"
authors = [{name = "w1ne", email = "14119286+w1ne@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
# Floor is set by the hard dependencies, not by taste:
#   - darktable_mcp/cli/install_plugin.py uses importlib.resources.files (3.9+)
#   - every mcp release in the pinned range declares Requires-Python >=3.10
# so 3.10 is the lowest interpreter this package can actually install on.
requires-python = ">=3.10"
keywords = ["darktable", "mcp", "model-context-protocol", "photo-editing", "photography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Floor is 2.0: darktable_mcp/server.py registers its tools through the mcp 2.x
    # low-level Server(on_list_tools=..., on_call_tool=...) constructor handlers, which
    # replaced the 1.x @server.list_tools() / @server.call_tool() decorators. Neither
    # spelling exists in the other major, so 1.x cannot run this code.
    # Upper bound guards the next major the same way: 2.0 already moved the wire types
    # to mcp_types (Tool.inputSchema -> Tool.input_schema) and made handlers return
    # ListToolsResult / CallToolResult instead of bare lists.
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
vision = [
    "rawpy>=0.19",
    "Pillow>=10.0",
    "pyexiv2>=2.12",
]

[project.urls]
Homepage = "https://github.com/w1ne/darktable-mcp"
Repository = "https://github.com/w1ne/darktable-mcp"
Issues = "https://github.com/w1ne/darktable-mcp/issues"

[project.scripts]
darktable-mcp = "darktable_mcp:main"

[tool.setuptools.packages.find]
include = ["darktable_mcp*"]

[tool.setuptools.package-data]
darktable_mcp = ["lua/*.lua"]

[tool.setuptools.dynamic]
version = {attr = "darktable_mcp.__version__"}

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
